[package]
name = "insightdesk-backend"
version = "0.1.0"
description = "InsightDesk - Local Document Intelligence and BI Desktop Application"
edition = "2021"

[lib]
name = "insightdesk_backend_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
calamine = "0.26"
csv = "1.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
pdf-extract = "0.7"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4", "serde"] }
regex = "1.11"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
